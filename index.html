<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Cat Simple</title>
  <style>
    body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:white; }
    img { width:380px; height:560px; object-fit:contain; }
    #s { position:absolute; bottom:20px; background:#333; color:white; padding:8px 16px; border-radius:12px; }
  </style>
</head>
<body>
  <img id="c" src="https://raw.githubusercontent.com/siupingala/cat-landing/main/frames_high/f_0001.jpg">
  <div id="s">載入中</div>
  <script>
    const imgs = [
      "https://raw.githubusercontent.com/siupingala/cat-landing/main/frames_high/f_0001.jpg",
      "https://raw.githubusercontent.com/siupingala/cat-landing/main/frames_high/f_0030.jpg",
      "https://raw.githubusercontent.com/siupingala/cat-landing/main/frames_high/f_0035.jpg",
      "https://raw.githubusercontent.com/siupingala/cat-landing/main/frames_high/f_0040.jpg"
    ];
    let i = 0;
    const img = document.getElementById("c");
    const s = document.getElementById("s");
    setInterval(() => {
      i = (i + 1) % imgs.length;
      img.src = imgs[i] + "?t=" + Date.now();
      s.textContent = "幀 " + (i+1);
    }, 400);
  </script>
</body>
</html>
